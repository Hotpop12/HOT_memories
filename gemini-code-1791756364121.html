<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video & Media Feed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #fff;
            padding-bottom: 70px;
        }
        header {
            background: #1a1d29;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #2a2e43;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            overflow-x: auto;
            background: #141722;
            padding: 10px;
            gap: 10px;
            white-space: nowrap;
            border-bottom: 1px solid #2a2e43;
        }
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            background: #212538;
            color: #ccc;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #ff4757;
            color: #fff;
        }
        /* Feed Container */
        .feed-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }
        .post-card {
            background: #1a1d29;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #2a2e43;
        }
        .post-header {
            padding: 12px;
            font-size: 14px;
            color: #ff4757;
            font-weight: 600;
        }
        .media-box {
            width: 100%;
            background: #000;
            position: relative;
            max-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-box img, .media-box video {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
        }
        .post-content {
            padding: 12px;
            font-size: 15px;
            line-height: 1.5;
        }
        .post-footer {
            padding: 10px 12px;
            font-size: 12px;
            color: #888;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #2a2e43;
        }
        /* Floating Post Button */
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            z-index: 1000;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 15px;
        }
        .modal-content {
            background: #1a1d29;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #2a2e43;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #ff4757;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #aaa;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background: #10121b;
            border: 1px solid #2a2e43;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-btns {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit { background: #ff4757; color: white; }
        .btn-cancel { background: #333; color: white; }
    </style>
</head>
<body>

    <header>Media Reels Feed</header>

    <!-- Navigation Bar -->
    <div class="nav-tabs" id="navTabs">
        <button class="tab-btn active" onclick="filterPosts('ALL', this)">All</button>
        <button class="tab-btn" onclick="filterPosts('TOP Video 🔥', this)">TOP Video 🔥</button>
        <button class="tab-btn" onclick="filterPosts('7STAR ⭐', this)">7STAR ⭐</button>
        <button class="tab-btn" onclick="filterPosts('Girlfriend 🙈', this)">Girlfriend 🙈</button>
        <button class="tab-btn" onclick="filterPosts('Night 🥵', this)">Night 🥵</button>
    </div>

    <!-- Feed Section -->
    <div class="feed-container" id="feedContainer">
        <!-- Posts will dynamically load here -->
    </div>

    <!-- Floating Post Button -->
    <button class="fab" onclick="openPostModal()">+ পোস্ট করুন</button>

    <!-- Key Input Modal -->
    <div class="modal" id="keyModal">
        <div class="modal-content">
            <h3>নিরাপত্তা যাচাই</h3>
            <div class="form-group">
                <label>পোস্ট করার সিক্রেট কি (Key) দিন:</label>
                <input type="password" id="secretKeyInput" placeholder="Secret Key দিন...">
            </div>
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeModals()">বাতিল</button>
                <button class="btn btn-submit" onclick="verifyKey()">পরবর্তী</button>
            </div>
        </div>
    </div>

    <!-- Create Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <h3>নতুন পোস্ট তৈরি করুন</h3>
            <div class="form-group">
                <label>মিডিয়া টাইপ:</label>
                <select id="mediaType">
                    <option value="video">ভিডিও (GitHub Link)</option>
                    <option value="image">ছবি (GitHub Link)</option>
                </select>
            </div>
            <div class="form-group">
                <label>GitHub বা সরাসরি লিংক:</label>
                <input type="text" id="mediaUrl" placeholder="যেমন: https://raw.githubusercontent.com/.../video.mp4">
            </div>
            <div class="form-group">
                <label>ক্যাটাগরি নির্বাচন করুন বা লিখুন:</label>
                <input type="text" id="postCategory" list="catList" placeholder="যেমন: TOP Video 🔥, 7STAR ⭐ ইত্যাদি">
                <datalist id="catList">
                    <option value="TOP Video 🔥">
                    <option value="7STAR ⭐">
                    <option value="Girlfriend 🙈">
                    <option value="Night 🥵">
                </datalist>
            </div>
            <div class="form-group">
                <label>ক্যাপশন বা টাইটেল:</label>
                <textarea id="postCaption" rows="3" placeholder="ভিডিও বা ছবির বিবরণ লিখুন..."></textarea>
            </div>
            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeModals()">বাতিল</button>
                <button class="btn btn-submit" onclick="savePost()">পাবলিশ করুন</button>
            </div>
        </div>
    </div>

    <script>
        // LocalStorage ভিত্তিক ডাটা স্টোরেজ
        let posts = JSON.parse(localStorage.getItem('media_posts')) || [
            {
                id: 1,
                type: 'video',
                url: 'https://www.w3schools.com/html/mov_bbb.mp4',
                category: 'TOP Video 🔥',
                caption: 'ডেমো ভিডিও পোস্ট - স্যাম্পল রিলস ভিডিও।',
                views: 150,
                time: 'Just now'
            }
        ];

        let currentCategory = 'ALL';

        function renderPosts() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';

            // ভিউ এর উপর ভিত্তি করে অটো TOP Video সাজানো লজিক বা ফিল্টার
            let filtered = posts;
            if (currentCategory !== 'ALL') {
                filtered = posts.filter(p => p.category === currentCategory);
            } else {
                // ভিউ বেশি থাকলে স্বয়ংক্রিয়ভাবে উপরে নিয়ে আসার সর্টিং (অপশনাল)
                filtered.sort((a, b) => b.views - a.views);
            }

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; margin-top:40px;">কোনো পোস্ট পাওয়া যায়নি!</p>';
                return;
            }

            filtered.forEach(post => {
                let mediaElement = '';
                if (post.type === 'video') {
                    mediaElement = `<div class="media-box"><video src="${post.url}" controls onplay="incrementView(${post.id})"></video></div>`;
                } else {
                    mediaElement = `<div class="media-box"><img src="${post.url}" onclick="incrementView(${post.id})" alt="Post Image"></div>`;
                }

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">📁 ${post.category}</div>
                    ${mediaElement}
                    <div class="post-content">${post.caption}</div>
                    <div class="post-footer">
                        <span>👀 ভিউ: ${post.views}</span>
                        <span>${post.time}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ভিউ কাউন্ট বাড়ানোর ফাংশন (বেশি ভিউ হলে স্বয়ংক্রিয়ভাবে TOP Video ক্যাটাগরিতে প্রভাব ফেলবে)
        function incrementView(id) {
            let post = posts.find(p => p.id === id);
            if (post) {
                post.views += 1;
                localStorage.setItem('media_posts', JSON.stringify(posts));
            }
        }

        // ট্যাব ফিল্টার করার ফাংশন
        function filterPosts(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPosts();
        }

        // মডাল কন্ট্রোল
        function openPostModal() {
            document.getElementById('keyModal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('keyModal').style.display = 'none';
            document.getElementById('postModal').style.display = 'none';
            document.getElementById('secretKeyInput').value = '';
        }

        // সিক্রেট কি চেক করার ফাংশন
        function verifyKey() {
            const key = document.getElementById('secretKeyInput').value;
            if (key === 'llkkjjhh') {
                document.getElementById('keyModal').style.display = 'none';
                document.getElementById('postModal').style.display = 'flex';
            } else {
                alert('ভুল সিক্রেট কি! সঠিক কি দিন।');
            }
        }

        // নতুন পোস্ট সেভ করার ফাংশন
        function savePost() {
            const type = document.getElementById('mediaType').value;
            const url = document.getElementById('mediaUrl').value.trim();
            const category = document.getElementById('postCategory').value.trim() || 'General';
            const caption = document.getElementById('postCaption').value.trim();

            if (!url) {
                alert('দয়া করে মিডিয়ার সঠিক লিংক দিন।');
                return;
            }

            const newPost = {
                id: Date.now(),
                type: type,
                url: url,
                category: category,
                caption: caption || 'কোনো ক্যাপশন নেই',
                views: 1,
                time: 'এইমাত্র'
            };

            posts.unshift(newPost);
            localStorage.setItem('media_posts', JSON.stringify(posts));
            closeModals();
            renderPosts();
            
            // ফর্ম ক্লিয়ার করা
            document.getElementById('mediaUrl').value = '';
            document.getElementById('postCategory').value = '';
            document.getElementById('postCaption').value = '';
        }

        // পেজ লোড হলে পোস্ট রেন্ডার করা
        window.onload = renderPosts;
    </script>
</body>
</html>
